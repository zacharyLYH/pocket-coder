name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Go) — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Lint (go vet)
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Docker integration tests
        run: go test -tags integration -count=1 ./internal/...
      - name: Verify generated mocks are up to date
        run: |
          go generate ./...
          test -z "$(git status --porcelain -- mocks)"

  frontend:
    name: Frontend (TS) — lint, build & behavioral tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck & build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests (parallel)
        run: npm run test:e2e:parallel

  docker-compose:
    name: Dev stack (docker compose) — build & health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: Create .env (server requires it; gitignored locally)
        run: |
          cat > .env <<'EOF'
          SPS_LOGIN_EMAIL=ci@example.com
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=ci@example.com
          SMTP_PASSWORD=ci
          SMTP_FROM=ci@example.com
          EOF
      - name: Build & boot the dev stack
        run: docker compose -f docker-compose.dev.yml up -d --build
      - name: Wait for server /health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && { echo 'health OK'; exit 0; }
            sleep 2
          done
          echo 'server never became healthy' >&2
          exit 1
      - name: Assert /health payload
        run: curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
      - name: Wait for Vite dev server
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:5173/ >/dev/null && { echo 'vite OK'; exit 0; }
            sleep 10
          done
          echo 'vite never came up' >&2
          exit 1
      - name: Assert Vite proxy reaches the server
        run: |
          curl -sf -X POST http://localhost:5173/api/auth/request-pin \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@example.com"}' \
            | grep -q '"ok":true'
      - name: Tear down
        run: docker compose -f docker-compose.dev.yml down
