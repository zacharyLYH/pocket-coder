# Dev stack. Boots the Go server and the Vite dev server proxying /api and
# /ws to it. The login account lives in state.json (seeded by `make setup`
# / `make dev-seed`). The data dir is bind-mounted from server/data so
# host-side commands rewrite the same state.json the container boots from.
#
#   docker compose -f docker-compose.dev.yml up
#   curl http://localhost:8080/health
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PCODER_DATA_DIR: /data
      PCODER_BIND: :8080
      PCODER_DOCKER_SOCK: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server/data:/data
    ports:
      - "8080:8080"
    networks:
      - default
      - pcoder-net

  web:
    image: node:24-alpine
    working_dir: /app
    environment:
      PCODER_SERVER_URL: http://server:8080
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules # container installs here, never in host ./web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  web-node-modules:

networks:
  # The server, project containers, and browser sidecars share this private
  # network. Project ports are still never published to the host.
  pcoder-net:
    name: pcoder-net
