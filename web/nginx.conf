# Production UI: static dist/ plus API/WS/health proxy to the server.
# The setup script polls /health through the published port, so it is
# proxied too — plain HTTP is v1 scope, TLS terminates here later.
upstream pcoder_server {
  server server:8080;
}

# Serve .webmanifest with its registered content type (some browsers
# reject the manifest served as octet-stream).
types {
  application/manifest+json webmanifest;
}

server {
  listen 80;

  # Exact server endpoints reachable through the published port.
  location = /health {
    proxy_pass http://pcoder_server;
  }

  # API + websocket proxy (mirrors the Vite dev proxy).
  location /api {
    proxy_pass http://pcoder_server;
    proxy_set_header Host $host;
  }
  location /ws {
    proxy_pass http://pcoder_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Idle terminals must survive: nginx defaults to 60s on a tunneled
    # connection and neither side heartbeats.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # The build fingerprints asset filenames, so they are immutable;
  # index.html itself stays uncached so deploys take effect at once.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The bundle is 2 MB uncompressed: gzip what compresses well.
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Static app shell with SPA fallback.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
