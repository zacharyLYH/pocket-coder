# Production UI: static dist/ plus API/WS/health proxy to the server.
# TLS terminates at Cloudflare (Tunnel upstream): nginx listens on plain
# HTTP inside the private net, and must forward what Cloudflare knows
# (proto + client IP) so the Go server can set Secure cookies and see
# real IPs. The setup script polls /health through localhost, so it is
# proxied too.
upstream pcoder_server {
  server server:8080;
}

# Serve .webmanifest with its registered content type (some browsers
# reject the manifest served as octet-stream).
types {
  application/manifest+json webmanifest;
}

# Restore the real browser IP from Cloudflare's header. Without this Go
# only ever sees the tunnel/docker hop. Trust is scoped to Cloudflare
# edge ranges + private nets (cloudflared/host) — Safe ONLY because the
# prod port is bound to 127.0.0.1 (see docker-compose.yml): anyone who can
# reach nginx directly can spoof CF-Connecting-IP.
# Source: https://www.cloudflare.com/ips (last synced 2026-01).
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.0.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
  listen 80;

  # Exact server endpoints reachable through the published port.
  location = /health {
    proxy_pass http://pcoder_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Pass through what Cloudflare sent ($scheme here is always http:
    # TLS ended at the edge). Go marks the session cookie Secure only
    # when this is "https".
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

   # API + websocket proxy (mirrors the Vite dev proxy). WebSocket upgrade
   # headers are required here because the noVNC preview surface opens its
   # WebSocket under /api/projects/{id}/preview/websockify. Without them nginx
   # demotes the upgrade to a plain GET, the Go reverse proxy never sees it,
   # and noVNC reports "Something went wrong, connection is closed".
   location /api {
     proxy_pass http://pcoder_server;
     proxy_set_header Host $host;
     proxy_set_header X-Real-IP $remote_addr;
     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
     proxy_http_version 1.1;
     proxy_set_header Upgrade $http_upgrade;
     proxy_set_header Connection "upgrade";
     # Project creation and harness installs run synchronous Docker builds
     # that can exceed nginx's 60s default: the first pcoder-project:v3
     # image pulls node/npm/python from apt, and npm harness installs hit
     # the network. 10 min covers a cold-engine first build reliably.
     proxy_read_timeout 600s;
     proxy_send_timeout 600s;
   }
  location /ws {
    proxy_pass http://pcoder_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Idle terminals must survive: nginx defaults to 60s on a tunneled
    # connection and neither side heartbeats.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # The build fingerprints asset filenames, so they are immutable;
  # index.html itself stays uncached so deploys take effect at once.
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The bundle is 2 MB uncompressed: gzip what compresses well.
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Static app shell with SPA fallback.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
