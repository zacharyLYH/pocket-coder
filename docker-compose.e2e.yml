# E2E override: ONLY the test deltas. Never used alone — always merged
# over the canonical stack, starting just the server (Playwright runs
# Vite itself, so the nginx web container would be dead weight):
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     -p <project> up --build server
services:
  server:
    environment:
      PCODER_LOGIN_EMAIL: me@example.com
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      # E2E clones come from the per-run git daemon on the host
      # (web/e2e/global-setup.ts), not from GitHub.
      PCODER_ALLOW_ANY_REPO: "1"
      PCODER_PREVIEW_TOKEN_SILENCE: ${PCODER_PREVIEW_TOKEN_SILENCE:-20s}
      PCODER_PREVIEW_SWEEP_INTERVAL: ${PCODER_PREVIEW_SWEEP_INTERVAL:-1s}
    volumes:
      - ${PCODER_E2E_DATA_DIR}:/data
    # Lets the container reach host-side test stubs (e.g. the fake LLM in
    # butler.live.spec.ts) via host.docker.internal on Linux and Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PCODER_E2E_API_PORT}:8080"

networks:
  pcoder-net:
    external: true
